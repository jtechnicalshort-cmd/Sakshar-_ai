
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKSHAR AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column
}
header{
 padding:18px;background:#151d35;
 text-align:center;border-bottom:1px solid #293653
}
header h2{margin:0;color:#65d9ff}
header p{margin:6px 0 0;color:#aab6d3;font-size:12px}
#chat{
 flex:1;overflow-y:auto;padding:18px;
 display:flex;flex-direction:column;gap:14px
}
.msg{
 padding:13px 16px;border-radius:15px;
 max-width:85%;line-height:1.5;white-space:pre-wrap
}
.user{background:#1769aa;align-self:flex-end}
.ai{background:#202b45;align-self:flex-start}
.bottom{
 display:flex;gap:8px;padding:12px;
 background:#151d35
}
input{
 flex:1;min-width:0;padding:14px;border-radius:12px;
 border:1px solid #405070;background:#0b1020;
 color:white;font-size:16px;outline:none
}
button{
 border:0;border-radius:12px;padding:0 20px;
 background:#16a6d9;color:white;font-weight:bold;
 font-size:15px
}
footer{text-align:center;padding:9px;color:#8997b5;font-size:11px}
</style>
</head>
<body>
<header>
<h2>✨ SAKSHAR AI</h2>
<p>Your Smart AI Assistant</p>
</header>

<main id="chat">
<div class="msg ai">नमस्ते! 👋 मैं SAKSHAR AI हूँ। बताओ, मैं तुम्हारी क्या मदद करूँ?</div>
</main>

<div class="bottom">
<input id="message" placeholder="Ask me anything..." />
<button onclick="sendMessage()">Send</button>
</div>

<footer>Made with ❤️ by Sakshar Jaiswal</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 addMessage("AI connection is being set up. Please wait!","ai");
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
